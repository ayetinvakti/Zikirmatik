<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zikirmatik | Ayetin Vakti</title>
    
    <!-- Sosyal Medya & Mesajlaşma Önizleme Etiketleri -->
    <meta property="og:title" content="Zikirmatik | Ayetin Vakti">
    <meta property="og:description" content="Titreşim ve ses destekli, kullanımı kolay dijital tesbih.">
    <meta property="og:type" content="website">

    <!-- Tema Sıçramasını Önleyici Erken Betik -->
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'light') {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        })();
    </script>

    <style>
        /* Gece Teması (Varsayılan Koyu Mode) */
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #10b981;
            --accent-hover: #047857;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --btn-bg: rgba(255, 255, 255, 0.05);
            --btn-hover: rgba(255, 255, 255, 0.1);
            --shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        }

        /* Gündüz Teması (Açık Mode) */
        [data-theme="light"] {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --accent-color: #059669;
            --accent-hover: #047857;
            --text-color: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --btn-bg: #f1f5f9;
            --btn-hover: #e2e8f0;
            --shadow: 0 10px 25px rgba(0, 0, 0, 0.06);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Header & Tema Butonu Düzeni */
        .header {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            margin-bottom: 20px;
            padding-top: 10px;
        }

        .theme-toggle-btn {
            position: absolute;
            right: 0;
            top: 0;
            background-color: var(--btn-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .header h1 {
            font-size: 1.8rem;
            color: var(--accent-color);
            margin-top: 20px;
            margin-bottom: 4px;
            text-align: center;
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.9rem;
            text-align: center;
        }

        /* Dijital Ekran */
        .display-card {
            background-color: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 20px;
            width: 100%;
            padding: 20px;
            text-align: center;
            box-shadow: var(--shadow);
            margin-bottom: 24px;
            position: relative;
        }

        .counter-value {
            font-size: 4rem;
            font-weight: 800;
            color: var(--accent-color);
            font-family: 'Courier New', Courier, monospace;
            letter-spacing: 2px;
        }

        .target-info {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-top: 6px;
            font-weight: 500;
        }

        /* Hedefe Ulaşıldı Bildirim Kutusu */
        .goal-alert {
            margin-top: 10px;
            background-color: rgba(16, 185, 129, 0.15);
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 700;
            display: none;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Ana Tıklama Alanı / Dairesel Tesbih Alanı (Canlı Dokunma Efektli) */
        .click-area {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            background: linear-gradient(145deg, var(--accent-color), var(--accent-hover));
            box-shadow: 0 12px 35px rgba(16, 185, 129, 0.4),
                        inset 0 4px 8px rgba(255, 255, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            /* Canlı ve akıcı basılma hissi için özel geçiş */
            transition: transform 0.06s cubic-bezier(0.4, 0, 0.2, 1), 
                        box-shadow 0.06s cubic-bezier(0.4, 0, 0.2, 1),
                        filter 0.06s ease;
            margin-bottom: 24px;
            touch-action: manipulation;
        }

        /* Dokunulduğunda veya tetiklendiğinde çalışan animasyon sınıfı */
        .click-area:active, .click-area.pressed {
            transform: scale(0.89) rotate(-1deg);
            box-shadow: 0 4px 10px rgba(16, 185, 129, 0.3),
                        inset 0 8px 15px rgba(0, 0, 0, 0.25);
            filter: brightness(0.9);
        }

        .click-label {
            font-size: 1.2rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 1px;
            pointer-events: none;
        }

        /* Kontrol Butonları */
        .controls {
            display: flex;
            gap: 12px;
            width: 100%;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background-color: var(--card-bg);
            color: var(--text-color);
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            touch-action: manipulation;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn:hover {
            background-color: var(--btn-hover);
        }

        /* Hedef Seçme Modalı */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 100;
        }

        .modal-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 24px;
            width: 100%;
            max-width: 320px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: var(--shadow);
        }

        .modal-title {
            font-size: 1.1rem;
            font-weight: 700;
            text-align: center;
            color: var(--text-color);
        }

        .target-options {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .target-opt-btn {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 12px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            font-size: 1rem;
        }

        .target-opt-btn.active {
            background-color: var(--accent-color);
            border-color: var(--accent-color);
            color: #fff;
        }

        .custom-target-box {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .custom-target-box label {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .custom-input {
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            font-size: 1rem;
            outline: none;
            text-align: center;
        }

        .modal-close-btn {
            background-color: var(--accent-color);
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 4px;
        }

        .footer {
            margin-top: 24px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <button class="theme-toggle-btn" onclick="toggleTheme()" id="theme-btn">
            ☀️ Gündüz
        </button>
        <h1>Zikirmatik</h1>
        <p>Ayetin Vakti</p>
    </div>

    <!-- Dijital Sayaç Ekranı -->
    <div class="display-card">
        <div class="counter-value" id="counter">0</div>
        <div class="target-info" id="target-info-text">Hedef: 33 (Kalan: 33)</div>
        <div class="goal-alert" id="goalAlert">🎉 Hedefe Ulaşıldı!</div>
    </div>

    <!-- Dokunma Alanı (Canlı Dokunma Efekti) -->
    <div class="click-area" id="clickArea" 
         ontouchstart="triggerPressEffect()" 
         onmousedown="triggerPressEffect()" 
         onclick="increment()">
        <span class="click-label">ZİKİR ÇEK</span>
    </div>

    <!-- Kontrol Butonları -->
    <div class="controls">
        <button class="btn" onclick="resetCounter()">🔄 Sıfırla</button>
        <button class="btn" onclick="openTargetModal()">🎯 Hedef Seç</button>
    </div>

    <div class="footer">
        Ses Destekli Dijital Tesbih
    </div>
</div>

<!-- Hedef Seçme Modal Penceresi -->
<div class="modal-overlay" id="targetModal" onclick="closeTargetModalOutside(event)">
    <div class="modal-card">
        <div class="modal-title">Hedef Seçiniz</div>
        <div class="target-options">
            <button class="target-opt-btn" onclick="setTarget(33)" id="btn33">33</button>
            <button class="target-opt-btn" onclick="setTarget(66)" id="btn66">66</button>
            <button class="target-opt-btn" onclick="setTarget(99)" id="btn99">99</button>
            <button class="target-opt-btn" onclick="setTarget(100)" id="btn100">100</button>
        </div>
        <div class="custom-target-box">
            <label for="customTargetInput">Özel Hedef Yazın:</label>
            <input type="number" id="customTargetInput" class="custom-input" placeholder="Örn: 500" oninput="setCustomTarget(this.value)">
        </div>
        <button class="modal-close-btn" onclick="closeTargetModal()">Tamam</button>
    </div>
</div>

<script>
    let count = parseInt(localStorage.getItem('zikir_count')) || 0;
    let target = parseInt(localStorage.getItem('zikir_target')) || 33;
    let audioCtx = null;

    const targetModal = document.getElementById('targetModal');
    const customInput = document.getElementById('customTargetInput');
    const counterEl = document.getElementById('counter');
    const targetInfoEl = document.getElementById('target-info-text');
    const goalAlertEl = document.getElementById('goalAlert');
    const clickAreaEl = document.getElementById('clickArea');

    // --- TEMA YÖNETİMİ ---
    function initTheme() {
        const savedTheme = localStorage.getItem('theme') || 'dark';
        applyTheme(savedTheme);
    }

    function toggleTheme() {
        const isLight = document.documentElement.getAttribute('data-theme') === 'light';
        const newTheme = isLight ? 'dark' : 'light';
        applyTheme(newTheme);
    }

    function applyTheme(theme) {
        const btn = document.getElementById('theme-btn');
        if (theme === 'light') {
            document.documentElement.setAttribute('data-theme', 'light');
            btn.innerHTML = '☀️ Gündüz'; 
            localStorage.setItem('theme', 'light');
        } else {
            document.documentElement.removeAttribute('data-theme');
            btn.innerHTML = '🌙 Gece'; 
            localStorage.setItem('theme', 'dark');
        }
    }

    // --- SES ÜRETİCİ (Güçlendirilmiş Yüksek Ses) ---
    function playClickSound(freq = 650, duration = 0.06) {
        try {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle'; // Daha tok ve gür bir ses tonu
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            
            // Ses yüksekliğini artırdık (Gain değerini yükselttik)
            gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        } catch (e) {
            console.log("Ses yürütülemedi:", e);
        }
    }

    // --- BUTON BASMA ANİMASYONU ---
    function triggerPressEffect() {
        clickAreaEl.classList.add('pressed');
        setTimeout(() => {
            clickAreaEl.classList.remove('pressed');
        }, 100);
    }

    // --- GÖRÜNÜM & HESAPLAMA GÜNCELLEME ---
    function updateDisplay() {
        counterEl.innerText = count;
        
        let remainder = target - (count % target);
        if (remainder === target) remainder = 0; 
        
        targetInfoEl.innerText = `Hedef: ${target} (Kalan: ${remainder})`;

        if (count > 0 && count % target === 0) {
            goalAlertEl.style.display = 'block';
        } else {
            goalAlertEl.style.display = 'none';
        }
    }

    // --- HEDEF YÖNETİMİ ---
    function openTargetModal() {
        targetModal.style.display = 'flex';
        if (![33, 66, 99, 100].includes(target)) {
            customInput.value = target;
        } else {
            customInput.value = '';
        }
        updateActiveButtonStates();
    }

    function closeTargetModal() {
        targetModal.style.display = 'none';
        updateDisplay();
    }

    function closeTargetModalOutside(event) {
        if (event.target === targetModal) {
            closeTargetModal();
        }
    }

    function setTarget(val) {
        target = val;
        localStorage.setItem('zikir_target', target);
        customInput.value = '';
        updateActiveButtonStates();
        updateDisplay();
        closeTargetModal();
    }

    function setCustomTarget(val) {
        let num = parseInt(val);
        if (num > 0) {
            target = num;
            localStorage.setItem('zikir_target', target);
            updateActiveButtonStates();
            updateDisplay();
        }
    }

    function updateActiveButtonStates() {
        [33, 66, 99, 100].forEach(num => {
            const btn = document.getElementById(`btn${num}`);
            if (btn) {
                if (target === num) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            }
        });
    }

    // --- SAYAÇ İŞLEMLERİ ---
    function increment() {
        count++;
        localStorage.setItem('zikir_count', count);

        if (target > 0 && count % target === 0) {
            playClickSound(880, 0.25);
        } else {
            playClickSound(650, 0.06);
        }

        updateDisplay();
    }

    function resetCounter() {
        if (count === 0) return;
        if (confirm("Sayacı sıfırlamak istediğinize emin misiniz?")) {
            count = 0;
            localStorage.setItem('zikir_count', count);
            updateDisplay();
        }
    }

    // Başlangıç Kurulumu
    window.onload = () => {
        initTheme();
        target = parseInt(localStorage.getItem('zikir_target')) || 33;
        updateActiveButtonStates();
        updateDisplay();
    };
</script>

</body>
</html>
