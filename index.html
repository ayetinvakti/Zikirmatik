<!DOCTYPE html>
<html lang="tr">
<head>
    <!-- Tema Sıçramasını Önleyici Script -->
    <script>
        if (localStorage.getItem('theme') === 'light') {
            document.documentElement.classList.add('light-mode');
        }
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zikirmatik | Ayetin Vakti</title>
    <!-- Sosyal Medya & Mesajlaşma Önizleme Etiketleri -->
    <meta property="og:title" content="Zikirmatik | Ayetin Vakti">
    <meta property="og:description" content="Titreşim ve ses destekli, kullanımı kolay dijital tesbih.">
    <meta property="og:image" content="https://hercayi9-byte.github.io/kapak-resmi.jpg">
    <meta property="og:type" content="website">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #10b981;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 1.8rem;
            color: var(--accent-color);
            margin-bottom: 4px;
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* Dijital Ekran */
        .display-card {
            background-color: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 20px;
            width: 100%;
            padding: 24px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            margin-bottom: 24px;
            position: relative;
        }

        .counter-value {
            font-size: 4.5rem;
            font-weight: 800;
            color: var(--accent-color);
            font-family: 'Courier New', Courier, monospace;
            letter-spacing: 2px;
        }

        .target-info {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 8px;
        }

        /* Ana Tıklama Alanı / Buton */
        .click-area {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            background: linear-gradient(145deg, #10b981, #047857);
            box-shadow: 0 10px 30px rgba(16, 185, 129, 0.4),
                        inset 0 4px 6px rgba(255, 255, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.05s ease, box-shadow 0.05s ease;
            margin-bottom: 24px;
        }

        .click-area:active {
            transform: scale(0.95);
            box-shadow: 0 5px 15px rgba(16, 185, 129, 0.2);
        }

        .click-label {
            font-size: 1.2rem;
            font-weight: 700;
            color: #0f172a;
            letter-spacing: 1px;
        }

        /* Kontrol Butonları */
        .controls {
            display: flex;
            gap: 12px;
            width: 100%;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background-color: var(--card-bg);
            color: var(--text-color);
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: #334155;
        }

        .footer {
            margin-top: 24px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        /* --- Açık Tema (Light Mode) Stilleri --- */
        body.light-mode {
            background-color: #f8fafc !important;
            color: #1a202c !important;
        }

        body.light-mode .header h1 {
            color: #059669 !important;
        }

        body.light-mode .header p,
        body.light-mode .target-info,
        body.light-mode .footer {
            color: #718096 !important;
        }

        body.light-mode .display-card {
            background-color: #ffffff !important;
            border-color: #e2e8f0 !important;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.06) !important;
        }

        body.light-mode .btn {
            background-color: #ffffff !important;
            border-color: #cbd5e1 !important;
            color: #1a202c !important;
        }

        body.light-mode .btn:hover {
            background-color: #f1f5f9 !important;
        }

        /* Tema Değiştirme Butonu */
        .theme-toggle-btn {
            position: fixed !important;
            top: 12px !important;
            right: 12px !important;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 6px 12px !important;
            border-radius: 20px !important;
            cursor: pointer;
            font-size: 0.85rem !important;
            display: flex;
            align-items: center;
            gap: 6px;
            z-index: 9999 !important;
            transition: all 0.3s ease;
        }

        body.light-mode .theme-toggle-btn {
            background: rgba(0, 0, 0, 0.06);
            border-color: rgba(0, 0, 0, 0.15);
            color: #2d3748 !important;
        }
    </style>
</head>
<body>

<button class="theme-toggle-btn" onclick="toggleTheme()">
    <span id="theme-icon">🌙</span> <span id="theme-text">Gece</span>
</button>

<div class="container">
    <div class="header">
        <h1>Zikirmatik</h1>
        <p>Ayetin Vakti</p>
    </div>

    <!-- Dijital Sayaç Ekrana -->
    <div class="display-card">
        <div class="counter-value" id="counter">0</div>
        <div class="target-info" id="target-text">Hedef: 33 / 66 / 99</div>
    </div>

    <!-- Büyük Dokunma Alanı -->
    <div class="click-area" onclick="increment()">
        <span class="click-label">ZİKİR ÇEK</span>
    </div>

    <!-- Sıfırla Butonu -->
    <div class="controls">
        <button class="btn" onclick="resetCounter()">🔄 Sıfırla</button>
    </div>

    <div class="footer">
        Titreşim & Ses Destekli Dijital Tesbih
    </div>
</div>

<script>
    let count = parseInt(localStorage.getItem('zikir_count')) || 0;
    let audioCtx = null;

    // Sayfa Açıldığında Kayıtlı Sayıyı Getir
    document.getElementById('counter').innerText = count;

    // Tema Değiştirme Mantığı
    function toggleTheme() {
        const isLight = document.documentElement.classList.toggle('light-mode');
        document.body.classList.toggle('light-mode', isLight);
        
        localStorage.setItem('theme', isLight ? 'light' : 'dark');
        updateThemeUI(isLight);
    }

    function updateThemeUI(isLight) {
        const icon = document.getElementById('theme-icon');
        const text = document.getElementById('theme-text');
        
        if (isLight) {
            if (icon) icon.innerText = '☀️';
            if (text) text.innerText = 'Gündüz';
        } else {
            if (icon) icon.innerText = '🌙';
            if (text) text.innerText = 'Gece';
        }
    }

    // Web Audio API ile Tatlı Ses Üretici
    function playClickSound(freq = 600, duration = 0.05) {
        try {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        } catch (e) {
            console.log("Ses çalınamadı:", e);
        }
    }

    // Sayı Artırma Fonksiyonu
    function increment() {
        count++;
        document.getElementById('counter').innerText = count;
        localStorage.setItem('zikir_count', count);

        // 33, 66, 99 veya 100'ün katlarına ulaşıldı mı?
        if (count > 0 && count % 33 === 0) {
            // Hedef Noktası: Uzun Ritimli Titreşim ve Özel Başarı Tonal Sesi
            if (navigator.vibrate) {
                navigator.vibrate([100, 50, 100, 50, 150]); 
            }
            playClickSound(880, 0.25); // Daha yüksek ve uzun ton
        } else {
            // Normal Tıklama: Çok Hafif Titreşim ve Tıklama Sesi
            if (navigator.vibrate) {
                navigator.vibrate(35); // Kısacık his
            }
            playClickSound(500, 0.04);
        }
    }

    // Sıfırlama
    function resetCounter() {
        if (count === 0) return;
        if (confirm("Sayacı sıfırlamak istediğinize emin misiniz?")) {
            count = 0;
            document.getElementById('counter').innerText = count;
            localStorage.setItem('zikir_count', count);
            if (navigator.vibrate) navigator.vibrate([50, 50, 50]);
        }
    }

    window.onload = () => {
        // Tema Durumunu Başlangıçta Yükle
        const isLight = localStorage.getItem('theme') === 'light';
        if (isLight) {
            document.documentElement.classList.add('light-mode');
            document.body.classList.add('light-mode');
        } else {
            document.documentElement.classList.remove('light-mode');
            document.body.classList.remove('light-mode');
        }
        updateThemeUI(isLight);
    };
</script>

</body>
</html>
