<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zikirmatik | Ayetin Vakti</title>
    
    <!-- Sosyal Medya & Mesajlaşma Önizleme Etiketleri -->
    <meta property="og:title" content="Zikirmatik | Ayetin Vakti">
    <meta property="og:description" content="Titreşim ve ses destekli, kullanımı kolay dijital tesbih.">
    <meta property="og:image" content="https://hercayi9-byte.github.io/kapak-resmi.jpg">
    <meta property="og:type" content="website">

    <!-- Tema Sıçramasını Önleyici Erken Betik -->
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'light') {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        })();
    </script>

    <style>
        /* Gece Teması (Varsayılan Koyu Mode) */
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #10b981;
            --accent-hover: #047857;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --btn-bg: rgba(255, 255, 255, 0.05);
            --btn-hover: rgba(255, 255, 255, 0.1);
            --shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        }

        /* Gündüz Teması (Açık Mode) */
        [data-theme="light"] {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --accent-color: #059669;
            --accent-hover: #047857;
            --text-color: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --btn-bg: #f1f5f9;
            --btn-hover: #e2e8f0;
            --shadow: 0 10px 25px rgba(0, 0, 0, 0.06);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Header & Tema Butonu Düzeni */
        .header {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            margin-bottom: 24px;
            padding-top: 10px;
        }

        .theme-toggle-btn {
            position: absolute;
            right: 0;
            top: 0;
            background-color: var(--btn-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .header h1 {
            font-size: 1.8rem;
            color: var(--accent-color);
            margin-top: 20px;
            margin-bottom: 4px;
            text-align: center;
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.9rem;
            text-align: center;
        }

        /* Dijital Ekran */
        .display-card {
            background-color: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 20px;
            width: 100%;
            padding: 24px;
            text-align: center;
            box-shadow: var(--shadow);
            margin-bottom: 24px;
        }

        .counter-value {
            font-size: 4.5rem;
            font-weight: 800;
            color: var(--accent-color);
            font-family: 'Courier New', Courier, monospace;
            letter-spacing: 2px;
        }

        .target-info {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 8px;
        }

        /* Ana Tıklama Alanı / Buton */
        .click-area {
            width: 210px;
            height: 210px;
            border-radius: 50%;
            background: linear-gradient(145deg, var(--accent-color), var(--accent-hover));
            box-shadow: 0 10px 30px rgba(16, 185, 129, 0.35),
                        inset 0 4px 6px rgba(255, 255, 255, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.05s ease, box-shadow 0.05s ease;
            margin-bottom: 24px;
            touch-action: manipulation;
        }

        .click-area:active {
            transform: scale(0.94);
            box-shadow: 0 5px 15px rgba(16, 185, 129, 0.2);
        }

        .click-label {
            font-size: 1.2rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 1px;
        }

        /* Kontrol Butonları */
        .controls {
            display: flex;
            gap: 12px;
            width: 100%;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background-color: var(--card-bg);
            color: var(--text-color);
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            touch-action: manipulation;
        }

        .btn:hover {
            background-color: var(--btn-hover);
        }

        .footer {
            margin-top: 24px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <button class="theme-toggle-btn" onclick="toggleTheme()" id="theme-btn">
            ☀️ Gündüz
        </button>
        <h1>Zikirmatik</h1>
        <p>Ayetin Vakti</p>
    </div>

    <!-- Dijital Sayaç Ekranı -->
    <div class="display-card">
        <div class="counter-value" id="counter">0</div>
        <div class="target-info" id="target-text">Hedef: 33 / 66 / 99</div>
    </div>

    <!-- Dokunma Alanı -->
    <div class="click-area" onclick="increment()">
        <span class="click-label">ZİKİR ÇEK</span>
    </div>

    <!-- Kontrol Butonları -->
    <div class="controls">
        <button class="btn" onclick="resetCounter()">🔄 Sıfırla</button>
    </div>

    <div class="footer">
        Titreşim & Ses Destekli Dijital Tesbih
    </div>
</div>

<script>
    let count = parseInt(localStorage.getItem('zikir_count')) || 0;
    let audioCtx = null;

    // --- TEMA YÖNETİMİ ---
    function initTheme() {
        const savedTheme = localStorage.getItem('theme') || 'dark';
        applyTheme(savedTheme);
    }

    function toggleTheme() {
        const isLight = document.documentElement.getAttribute('data-theme') === 'light';
        const newTheme = isLight ? 'dark' : 'light';
        applyTheme(newTheme);
    }

    function applyTheme(theme) {
        const btn = document.getElementById('theme-btn');
        if (theme === 'light') {
            document.documentElement.setAttribute('data-theme', 'light');
            btn.innerHTML = '🌙 Gece';
            localStorage.setItem('theme', 'light');
        } else {
            document.documentElement.removeAttribute('data-theme');
            btn.innerHTML = '☀️ Gündüz';
            localStorage.setItem('theme', 'dark');
        }
    }

    // --- SES ÜRETİCİ (Web Audio API) ---
    function playClickSound(freq = 600, duration = 0.05) {
        try {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        } catch (e) {
            console.log("Ses yürütülemedi:", e);
        }
    }

    // --- SAYAÇ İŞLEMLERİ ---
    function increment() {
        count++;
        document.getElementById('counter').innerText = count;
        localStorage.setItem('zikir_count', count);

        // 33, 66, 99 veya 33'ün katlarında özel uyarı
        if (count > 0 && count % 33 === 0) {
            if (navigator.vibrate) {
                navigator.vibrate([100, 50, 100, 50, 150]); 
            }
            playClickSound(880, 0.25);
        } else {
            if (navigator.vibrate) {
                navigator.vibrate(35);
            }
            playClickSound(500, 0.04);
        }
    }

    function resetCounter() {
        if (count === 0) return;
        if (confirm("Sayacı sıfırlamak istediğinize emin misiniz?")) {
            count = 0;
            document.getElementById('counter').innerText = count;
            localStorage.setItem('zikir_count', count);
            if (navigator.vibrate) navigator.vibrate([50, 50, 50]);
        }
    }

    // Başlangıç Kurulumu
    window.onload = () => {
        initTheme();
        document.getElementById('counter').innerText = count;
    };
</script>

</body>
</html>
