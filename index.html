<!DOCTYPE html>
<html lang="tr">
<head>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <script>
        // Tema ve Özel Renk Paleti Kontrolü (Sayfa yüklenmeden önce çalışır, titremeyi önler)
        const savedTheme = localStorage.getItem('theme');
        const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (savedTheme === 'light' || (!savedTheme && !systemPrefersDark)) {
            document.documentElement.classList.add('light-mode');
            document.body && document.body.classList.add('light-mode');
        }

        const savedAccent = localStorage.getItem('custom_accent');
        const savedBg = localStorage.getItem('custom_bg');
        const savedText = localStorage.getItem('custom_text');

        if (savedAccent) document.documentElement.style.setProperty('--accent-color', savedAccent);
        if (savedBg) {
            document.documentElement.style.setProperty('--bg-color', savedBg);
            document.documentElement.style.setProperty('--card-bg', savedBg);
        }
        if (savedText) document.documentElement.style.setProperty('--text-color', savedText);

        const currentLang = localStorage.getItem('user_lang') || 'tr';
        if (currentLang === 'ar') {
            document.documentElement.setAttribute('dir', 'rtl');
        } else {
            document.documentElement.setAttribute('dir', 'ltr');
        }
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title data-i18n="page_title">Zikirmatik | Ayetin Vakti</title>
    
    <meta property="og:title" content="Zikirmatik | Ayetin Vakti">
    <meta property="og:description" content="Titreşim ve ses destekli, kullanımı kolay dijital tesbih.">
    <meta property="og:type" content="website">

    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #10b981;
            --accent-hover: #047857;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --btn-bg: rgba(255, 255, 255, 0.05);
            --btn-hover: rgba(255, 255, 255, 0.1);
            --shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            --bead-inactive: #475569;
        }

        html.light-mode, body.light-mode {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --accent-color: #059669;
            --accent-hover: #047857;
            --text-color: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --btn-bg: #f1f5f9;
            --btn-hover: #e2e8f0;
            --shadow: 0 10px 25px rgba(0, 0, 0, 0.06);
            --bead-inactive: #cbd5e1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }

        .container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .navbar {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
            position: relative;
        }

        [dir="rtl"] .navbar {
            flex-direction: row-reverse;
        }

        .nav-right-group {
            display: flex;
            gap: 8px;
        }

        .home-btn, .theme-icon-btn, .view-mode-btn {
            background-color: var(--btn-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }

        .home-btn:hover, .theme-icon-btn:hover, .view-mode-btn:hover {
            background-color: var(--btn-hover);
        }

        .sweet-dhikr-bar {
            width: 100%;
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin-bottom: 10px;
            padding: 6px 12px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            box-shadow: var(--shadow);
        }

        .sweet-dhikr-item {
            font-family: 'Caveat', cursive, sans-serif;
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--accent-color);
            letter-spacing: 0.5px;
        }

        .header {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 15px;
        }

        .header h1 {
            font-size: 1.8rem;
            color: var(--accent-color);
            margin-bottom: 2px;
            text-align: center;
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.85rem;
            text-align: center;
        }

        .view-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 320px;
            margin-bottom: 20px;
        }

        /* --- GÖRÜNÜM 1: Dairesel Tesbih --- */
        .tesbih-wrapper {
            position: relative;
            width: 300px;
            height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tesbih-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            transform: rotate(-90deg);
        }

        .bead {
            transition: fill 0.2s ease, r 0.2s ease;
        }

        .click-area {
            width: 170px;
            height: 170px;
            border-radius: 50%;
            background: linear-gradient(145deg, var(--card-bg), var(--bg-color));
            border: 4px solid var(--accent-color);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.06s cubic-bezier(0.4, 0, 0.2, 1);
            touch-action: manipulation;
            z-index: 2;
        }

        .click-area:active {
            transform: scale(0.91);
        }

        .counter-value {
            font-size: 2.8rem;
            font-weight: 800;
            color: var(--text-color);
            font-family: 'Courier New', Courier, monospace;
            line-height: 1;
            margin-bottom: 2px;
        }

        .counter-target-label {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--accent-color);
            margin-bottom: 2px;
        }

        .sub-counter {
            font-size: 0.75rem;
            color: var(--text-muted);
        }


        /* --- GÖRÜNÜM 2: GERÇEKÇİ PARMAK VE BOĞUM SAYIMI --- */
        .hand-view-card {
            width: 100%;
            max-width: 340px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            position: relative;
        }

        .hand-svg-container {
            width: 100%;
            height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .phalanx-node {
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .phalanx-node:hover circle {
            stroke: var(--accent-color);
            stroke-width: 3px;
        }

        .hand-info-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 5px;
        }

        .hand-counter-val {
            font-size: 2.2rem;
            font-weight: 800;
            font-family: 'Courier New', Courier, monospace;
            color: var(--text-color);
        }

        .hand-hint {
            font-size: 0.8rem;
            color: var(--accent-color);
            font-weight: 600;
            text-align: center;
            margin-top: 2px;
        }


        /* --- GÖRÜNÜM 3: GERÇEKÇİ KAYDIRMALI TESBİH --- */
        .drag-tesbih-card {
            width: 100%;
            max-width: 340px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 20px 15px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            touch-action: none; /* Kaydırma jestleri için gerekli */
            cursor: grab;
        }

        .drag-tesbih-card:active {
            cursor: grabbing;
        }

        .drag-track-svg {
            width: 100%;
            height: 120px;
        }

        .drag-info {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }

        .drag-counter-val {
            font-size: 2.2rem;
            font-weight: 800;
            font-family: 'Courier New', Courier, monospace;
            color: var(--text-color);
        }

        .drag-hint {
            font-size: 0.78rem;
            color: var(--accent-color);
            font-weight: 600;
            text-align: center;
        }


        .controls {
            display: flex;
            gap: 12px;
            width: 100%;
        }

        .btn {
            flex: 1;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background-color: var(--card-bg);
            color: var(--text-color);
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            touch-action: manipulation;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            box-shadow: var(--shadow);
        }

        .btn:hover {
            background-color: var(--btn-hover);
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 100;
        }

        .modal-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 24px;
            width: 100%;
            max-width: 320px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: var(--shadow);
        }

        .modal-title {
            font-size: 1.1rem;
            font-weight: 700;
            text-align: center;
            color: var(--text-color);
        }

        .target-options {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .target-opt-btn {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 12px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            font-size: 1rem;
        }

        .target-opt-btn.active {
            background-color: var(--accent-color);
            border-color: var(--accent-color);
            color: #fff;
        }

        .custom-target-box {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .custom-target-box label {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .custom-input {
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            font-size: 1rem;
            outline: none;
            text-align: center;
        }

        .modal-close-btn {
            background-color: var(--accent-color);
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 4px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="navbar">
        <a href="../" class="home-btn" title="Ana Sayfa">←</a>
        <div class="nav-right-group">
            <button class="view-mode-btn" onclick="toggleViewMode()" id="viewModeBtn" title="Görünüm Değiştir">🔄</button>
            <button class="theme-icon-btn" onclick="toggleTheme()" id="theme-btn" title="Tema Değiştir">☀️</button>
        </div>
    </div>

    <div class="sweet-dhikr-bar">
        <span class="sweet-dhikr-item" data-i18n="dhikr_subhanallah">Sübhanallah</span>
        <span class="sweet-dhikr-item" data-i18n="dhikr_elhamdulillah">Elhamdülillah</span>
        <span class="sweet-dhikr-item" data-i18n="dhikr_allahuakber">Allahu Ekber</span>
    </div>

    <div class="header">
        <h1 data-i18n="main_title">Zikirmatik</h1>
        <p data-i18n="brand_subtitle">Ayetin Vakti</p>
    </div>

    <!-- GÖRÜNÜM 1: Dairesel Tesbih -->
    <div class="view-container" id="view1">
        <div class="tesbih-wrapper">
            <svg class="tesbih-svg" viewBox="0 0 300 300" id="tesbihSvg">
            </svg>

            <div class="click-area" id="clickArea1" onclick="increment()">
                <div class="counter-value" id="counter1">0</div>
                <div class="counter-target-label" id="targetLabel1">/ 33</div>
                <div class="sub-counter" id="remainderLabel1">Kalan: 33</div>
            </div>
        </div>
    </div>

    <!-- GÖRÜNÜM 2: PARMAK BOĞUMLARIYLA ZİKİR -->
    <div class="view-container" id="view2" style="display: none;">
        <div class="hand-view-card">
            <div class="hand-svg-container" id="handSvgContainer">
                <!-- SVG El ve Boğum Noktaları Dinamik Çizilir -->
            </div>
            <div class="hand-info-box">
                <div class="hand-counter-val" id="counter2">0</div>
                <div class="hand-hint" data-i18n="hand_hint">Parmak boğumlarına dokunarak zikir çekin</div>
            </div>
        </div>
    </div>

    <!-- GÖRÜNÜM 3: GERÇEKÇİ KAYDIRMALI TESBİH -->
    <div class="view-container" id="view3" style="display: none;">
        <div class="drag-tesbih-card" id="dragCard">
            <svg class="drag-track-svg" id="dragTrackSvg" viewBox="0 0 320 120">
                <!-- Yatay Tesbih Çizgisi, Taneleri ve İmamet -->
            </svg>
            <div class="drag-info">
                <div class="drag-counter-val" id="counter3">0</div>
                <div class="drag-hint" data-i18n="drag_hint">Tesbihi aşağı veya yana doğru kaydırın</div>
            </div>
        </div>
    </div>

    <div class="controls">
        <button class="btn" onclick="resetCounter()" data-i18n="btn_reset">↺ Sıfırla</button>
        <button class="btn" onclick="openTargetModal()" data-i18n="btn_target">🎯 Hedef Seç</button>
    </div>
</div>

<div class="modal-overlay" id="targetModal" onclick="closeTargetModalOutside(event)">
    <div class="modal-card">
        <div class="modal-title" data-i18n="modal_title">Hedef Seçiniz</div>
        <div class="target-options">
            <button class="target-opt-btn" onclick="setTarget(33)" id="btn33">33</button>
            <button class="target-opt-btn" onclick="setTarget(66)" id="btn66">66</button>
            <button class="target-opt-btn" onclick="setTarget(99)" id="btn99">99</button>
            <button class="target-opt-btn" onclick="setTarget(100)" id="btn100">100</button>
        </div>
        <div class="custom-target-box">
            <label for="customTargetInput" data-i18n="modal_custom_label">Özel Hedef Yazın:</label>
            <input type="number" id="customTargetInput" class="custom-input" placeholder="Örn: 500" oninput="setCustomTarget(this.value)">
        </div>
        <button class="modal-close-btn" onclick="closeTargetModal()" data-i18n="modal_close">Tamam</button>
    </div>
</div>

<script>
    const translations = {
        tr: {
            page_title: "Zikirmatik | Ayetin Vakti",
            main_title: "Zikirmatik",
            brand_subtitle: "Ayetin Vakti",
            dhikr_subhanallah: "Sübhanallah",
            dhikr_elhamdulillah: "Elhamdülillah",
            dhikr_allahuakber: "Allahu Ekber",
            btn_reset: "↺ Sıfırla",
            btn_target: "🎯 Hedef Seç",
            modal_title: "Hedef Seçiniz",
            modal_custom_label: "Özel Hedef Yazın:",
            modal_close: "Tamam",
            remainder_text: "Kalan: ",
            reset_confirm: "Sayacı sıfırlamak istediğinize emin misiniz?",
            hand_hint: "Parmak boğumlarına dokunarak zikir çekin",
            drag_hint: "Tesbihi parmağınızla kaydırarak çekin"
        },
        en: {
            page_title: "Digital Tasbih | Ayetin Vakti",
            main_title: "Tasbih Counter",
            brand_subtitle: "Ayetin Vakti",
            dhikr_subhanallah: "Subhanallah",
            dhikr_elhamdulillah: "Alhamdulillah",
            dhikr_allahuakber: "Allahu Akbar",
            btn_reset: "🔄 Reset",
            btn_target: "🎯 Set Target",
            modal_title: "Select Target",
            modal_custom_label: "Custom Target:",
            modal_close: "Done",
            remainder_text: "Remaining: ",
            reset_confirm: "Are you sure you want to reset the counter?",
            hand_hint: "Tap on finger joints to count",
            drag_hint: "Swipe the tasbih with your finger"
        },
        ar: {
            page_title: "المسبحة الإلكترونية | آية الوقت",
            main_title: "السبحة",
            brand_subtitle: "آية الوقت",
            dhikr_subhanallah: "سُبْحَانَ اللَّهِ",
            dhikr_elhamdulillah: "الْحَمْدُ لِلَّهِ",
            dhikr_allahuakber: "اللَّهُ أَكْبَرُ",
            btn_reset: "🔄 إبادة",
            btn_target: "🎯 اختر الهدف",
            modal_title: "اختر الهدف",
            modal_custom_label: "هدف مخصص:",
            modal_close: "تم",
            remainder_text: "المتبقي: ",
            reset_confirm: "هل أنت متأكد من رغبتك في إعادة ضبط العداد؟",
            hand_hint: "اضغط على عُقد الأصابع للعد",
            drag_hint: "اسحب المسبحة بإصبعك للعد"
        }
    };

    const activeLang = localStorage.getItem('user_lang') || 'tr';
    const t = translations[activeLang] || translations['tr'];

    let count = parseInt(localStorage.getItem('zikir_count')) || 0;
    let target = parseInt(localStorage.getItem('zikir_target')) || 33;
    let currentViewMode = parseInt(localStorage.getItem('zikir_view_mode')) || 1;
    let audioCtx = null;

    const targetModal = document.getElementById('targetModal');
    const customInput = document.getElementById('customTargetInput');
    const counterEl1 = document.getElementById('counter1');
    const counterEl2 = document.getElementById('counter2');
    const counterEl3 = document.getElementById('counter3');
    const targetLabelEl1 = document.getElementById('targetLabel1');
    const remainderLabelEl1 = document.getElementById('remainderLabel1');
    const tesbihSvg = document.getElementById('tesbihSvg');
    const handSvgContainer = document.getElementById('handSvgContainer');
    const dragCard = document.getElementById('dragCard');
    const dragTrackSvg = document.getElementById('dragTrackSvg');
    const themeBtn = document.getElementById('theme-btn');

    function updateThemeButton(isLight) {
        if (themeBtn) themeBtn.textContent = isLight ? '☀️' : '🌙';
    }

    function setTheme(isLight) {
        if (isLight) {
            document.documentElement.classList.add('light-mode');
            document.body.classList.add('light-mode');
            localStorage.setItem('theme', 'light');
        } else {
            document.documentElement.classList.remove('light-mode');
            document.body.classList.remove('light-mode');
            localStorage.setItem('theme', 'dark');
        }
        updateThemeButton(isLight);
    }

    function toggleTheme() {
        const isLight = document.documentElement.classList.contains('light-mode');
        setTheme(!isLight);
    }

    const savedThemeInitial = localStorage.getItem('theme');
    const systemPrefersDarkInitial = window.matchMedia('(prefers-color-scheme: dark)').matches;
    const isLightInitial = (savedThemeInitial === 'light') || (!savedThemeInitial && !systemPrefersDarkInitial);
    if (isLightInitial) {
        document.documentElement.classList.add('light-mode');
        document.body.classList.add('light-mode');
    }
    updateThemeButton(isLightInitial);

    function toggleViewMode() {
        currentViewMode = currentViewMode >= 3 ? 1 : currentViewMode + 1;
        localStorage.setItem('zikir_view_mode', currentViewMode);
        applyViewMode();
        updateDisplay();
    }

    function applyViewMode() {
        document.getElementById('view1').style.display = currentViewMode === 1 ? 'flex' : 'none';
        document.getElementById('view2').style.display = currentViewMode === 2 ? 'flex' : 'none';
        document.getElementById('view3').style.display = currentViewMode === 3 ? 'flex' : 'none';
        if (currentViewMode === 2) renderHandView();
        if (currentViewMode === 3) renderDragTesbih();
    }

    function playClickSound(freq = 650, duration = 0.06) {
        try {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        } catch (e) {}
    }

    // --- GÖRÜNÜM 1: DAİRESEL TESBİH ---
    function renderTesbihBeads() {
        tesbihSvg.innerHTML = '';
        let centerX = 150, centerY = 150, radius = 125;
        let totalBeads = target > 60 ? 60 : target;
        if (totalBeads < 20) totalBeads = 33;
        let currentProgressInTarget = count % target;

        for (let i = 0; i < totalBeads; i++) {
            let angle = (i * 2 * Math.PI) / totalBeads;
            let x = centerX + radius * Math.cos(angle);
            let y = centerY + radius * Math.sin(angle);
            let circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
            circle.setAttribute("cx", x);
            circle.setAttribute("cy", y);
            circle.setAttribute("r", "4.5");
            circle.setAttribute("class", "bead");

            let activeThreshold = Math.floor((currentProgressInTarget / target) * totalBeads);
            if (i < activeThreshold || (currentProgressInTarget > 0 && i === 0)) {
                circle.setAttribute("fill", "var(--accent-color)");
                circle.setAttribute("r", "5.5");
            } else {
                circle.setAttribute("fill", "var(--bead-inactive)");
            }
            tesbihSvg.appendChild(circle);
        }
    }

    // --- GÖRÜNÜM 2: PARMAK VE BOĞUMLAR ---
    function renderHandView() {
        let currentProgress = count % target;
        // Her parmakta 3 boğum var (İşaret, Orta, Yüzük, Serçe = 12 boğum). 
        // 33'lük döngüye tam uyarlamak için her boğuma basıldığında zikir artar.
        
        let svgHTML = `<svg viewBox="0 0 300 200" style="width:100%; height:100%;">`;
        // El tabanı / avuç içi çizgisel taslak
        svgHTML += `<path d="M90 170 L90 120 C90 100 110 90 130 90 L170 90 C190 90 210 100 210 120 L210 170 Z" fill="none" stroke="var(--border-color)" stroke-width="3" stroke-dasharray="4 4"/>`;

        // 4 Parmak X koordinatları
        const fingers = [
            { name: 'serce', x: 100, baseY: 110 },
            { name: 'yuzuk', x: 130, baseY: 95 },
            { name: 'orta',  x: 160, baseY: 90 },
            { name: 'isaret',x: 190, baseY: 100 }
        ];

        let jointIndex = 0;
        fingers.forEach((f, fIdx) => {
            // Parmak uzantısı
            svgHTML += `<line x1="${f.x}" y1="${f.baseY + 50}" x2="${f.x}" y2="${f.baseY}" stroke="var(--border-color)" stroke-width="6" stroke-linecap="round"/>`;
            
            // 3 Boğum noktası
            for (let j = 0; j < 3; j++) {
                let jY = f.baseY + (j * 15);
                let isActive = jointIndex < (currentProgress % 12);
                let fillColor = isActive ? 'var(--accent-color)' : 'var(--bead-inactive)';
                
                svgHTML += `<g class="phalanx-node" onclick="increment()">
                    <circle cx="${f.x}" cy="${jY}" r="7" fill="${fillColor}" stroke="var(--card-bg)" stroke-width="2"/>
                </g>`;
                jointIndex++;
            }
        });

        svgHTML += `</svg>`;
        handSvgContainer.innerHTML = svgHTML;
    }


    // --- GÖRÜNÜM 3: KAYDIRMALI GERÇEKÇİ TESBİH ---
    function renderDragTesbih() {
        let currentProgressInTarget = count % target;
        let totalDisplayBeads = 14;
        let svgHTML = `<svg viewBox="0 0 320 120" style="width:100%; height:100%;">`;
        
        // Tesbih İpi
        svgHTML += `<path d="M 20 60 Q 160 90 300 60" fill="none" stroke="var(--border-color)" stroke-width="2"/>`;

        // İmameli Başlık / Püskül sağda
        svgHTML += `<rect x="290" y="45" width="8" height="30" rx="3" fill="var(--accent-color)"/>`;
        svgHTML += `<circle cx="294" cy="40" r="4" fill="var(--accent-color)"/>`;

        // Boncuklar
        let step = 260 / totalDisplayBeads;
        let activeThreshold = Math.floor((currentProgressInTarget / target) * totalDisplayBeads);

        for (let i = 0; i < totalDisplayBeads; i++) {
            let bx = 30 + (i * step);
            let by = 60 + Math.sin(i * 0.5) * 12; // Eğrisel yay görünümü

            let isActive = i < activeThreshold;
            let fillColor = isActive ? 'var(--accent-color)' : 'var(--bead-inactive)';
            let rSize = isActive ? 7 : 5.5;

            svgHTML += `<circle cx="${bx}" cy="${by}" r="${rSize}" fill="${fillColor}" />`;
        }

        svgHTML += `</svg>`;
        dragTrackSvg.innerHTML = svgHTML;
    }

    // Dokunmatik / Fare ile Kaydırma (Swipe) Algılama
    let touchStartY = 0;
    let touchStartX = 0;

    dragCard.addEventListener('touchstart', (e) => {
        touchStartY = e.touches[0].clientY;
        touchStartX = e.touches[0].clientX;
    }, {passive: true});

    dragCard.addEventListener('touchmove', (e) => {
        let diffY = e.touches[0].clientY - touchStartY;
        let diffX = e.touches[0].clientX - touchStartX;
        if (Math.abs(diffY) > 25 || Math.abs(diffX) > 25) {
            increment();
            touchStartY = e.touches[0].clientY;
            touchStartX = e.touches[0].clientX;
        }
    }, {passive: true});

    // Bilgisayar için mouse sürükleme desteği
    let isMouseDown = false;
    dragCard.addEventListener('mousedown', (e) => {
        isMouseDown = true;
        touchStartY = e.clientY;
    });
    window.addEventListener('mouseup', () => { isMouseDown = false; });
    dragCard.addEventListener('mousemove', (e) => {
        if (!isMouseDown) return;
        let diffY = e.clientY - touchStartY;
        if (Math.abs(diffY) > 20) {
            increment();
            touchStartY = e.clientY;
        }
    });


    function updateDisplay() {
        let currentInLoop = count % target;
        let remainder = target - currentInLoop;
        if (remainder === target && count > 0) remainder = 0;

        counterEl1.innerText = currentInLoop;
        targetLabelEl1.innerText = `/ ${target}`;
        remainderLabelEl1.innerText = `${t.remainder_text}${remainder}`;

        counterEl2.innerText = currentInLoop;
        counterEl3.innerText = currentInLoop;

        if (currentViewMode === 1) renderTesbihBeads();
        if (currentViewMode === 2) renderHandView();
        if (currentViewMode === 3) renderDragTesbih();
    }

    function openTargetModal() {
        targetModal.style.display = 'flex';
        if (![33, 66, 99, 100].includes(target)) {
            customInput.value = target;
        } else {
            customInput.value = '';
        }
        updateActiveButtonStates();
    }

    function closeTargetModal() {
        targetModal.style.display = 'none';
        updateDisplay();
    }

    function closeTargetModalOutside(event) {
        if (event.target === targetModal) closeTargetModal();
    }

    function setTarget(val) {
        target = val;
        localStorage.setItem('zikir_target', target);
        customInput.value = '';
        updateActiveButtonStates();
        updateDisplay();
        closeTargetModal();
    }

    function setCustomTarget(val) {
        let num = parseInt(val);
        if (num > 0) {
            target = num;
            localStorage.setItem('zikir_target', target);
            updateActiveButtonStates();
            updateDisplay();
        }
    }

    function updateActiveButtonStates() {
        [33, 66, 99, 100].forEach(num => {
            const btn = document.getElementById(`btn${num}`);
            if (btn) {
                if (target === num) btn.classList.add('active');
                else btn.classList.remove('active');
            }
        });
    }

    function increment() {
        count++;
        localStorage.setItem('zikir_count', count);

        if (count > 0 && count % target === 0) {
            playClickSound(880, 0.25);
        } else {
            playClickSound(650, 0.06);
        }
        updateDisplay();
    }

    function resetCounter() {
        if (count === 0) return;
        if (confirm(t.reset_confirm)) {
            count = 0;
            localStorage.setItem('zikir_count', count);
            updateDisplay();
        }
    }

    window.onload = () => {
        target = parseInt(localStorage.getItem('zikir_target')) || 33;
        currentViewMode = parseInt(localStorage.getItem('zikir_view_mode')) || 1;

        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            if (t[key]) {
                if (el.tagName === 'TITLE') document.title = t[key];
                else el.innerHTML = t[key];
            }
        });

        applyViewMode();
        updateActiveButtonStates();
        updateDisplay();
    };
</script>

</body>
</html>
