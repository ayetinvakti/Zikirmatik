<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <title>Zikirmatik - Ayetin Vakti</title>
    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            /* Mobilde dokunmatik zoom yapmayı engellemek için */
            touch-action: manipulation; 
        }
        body { background-color: #d2dcdd; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: #ffffff; width: 100%; max-width: 380px; padding: 30px 20px; border-radius: 28px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); text-align: center; }
        .brand { font-size: 14px; text-transform: uppercase; letter-spacing: 2px; color: #666; margin-bottom: 5px; font-weight: 600; }
        .title { font-size: 22px; color: #2d3748; margin-bottom: 25px; font-weight: 700; }
        .counter-box { background: #f1f5f9; border-radius: 20px; padding: 30px 10px; margin-bottom: 25px; border: 1px solid #e2e8f0; }
        .count { font-size: 64px; font-weight: 800; color: #1e293b; font-mono: monospace; }
        .btn-tap { 
            width: 100%; 
            padding: 25px; 
            font-size: 20px; 
            font-weight: 700; 
            color: white; 
            background: #2f3e46; 
            border: none; 
            border-radius: 18px; 
            cursor: pointer; 
            transition: transform 0.1s; 
            box-shadow: 0 4px 12px rgba(47, 62, 70, 0.3);
            /* Butona hızlı dokunulduğunda mavi vurgu yapmasını kapatır */
            -webkit-tap-highlight-color: transparent;
        }
        .btn-tap:active { transform: scale(0.96); background: #3a4f59; }
        .btn-reset { margin-top: 15px; background: transparent; border: none; color: #94a3b8; font-size: 13px; cursor: pointer; text-decoration: underline; -webkit-tap-highlight-color: transparent;}
    </style>
</head>
<body>
    <div class="card">
        <div class="brand">Ayetin Vakti</div>
        <div class="title">Dijital Zikirmatik</div>
        <div class="counter-box">
            <div class="count" id="counter">0</div>
        </div>
        <button class="btn-tap" onclick="addCount()">ÇEK (ZİKİR)</button>
        <button class="btn-reset" onclick="resetCount()">Sayacı Sıfırla</button>
    </div>

    <script>
        let count = localStorage.getItem('ayetinvakti_zikir') ? parseInt(localStorage.getItem('ayetinvakti_zikir')) : 0;
        document.getElementById('counter').innerText = count;

        // Ses Motoru (Web Audio API)
        let audioCtx = null;

        function playClickSound() {
            try {
                // AudioContext'i kullanıcı butona ilk bastığında başlatıyoruz (Tarayıcı kısıtlamalarını aşmak için)
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'sine';
                // Tok ve mekanik bir klik tonu (600 Hz)
                osc.frequency.setValueAtTime(600, audioCtx.currentTime); 

                // Çok kısa ve hızlı sönümlenen ses profili (0.03 saniye)
                gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.03);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + 0.03);
            } catch (e) {
                console.log("Ses çalınamadı:", e);
            }
        }

        function addCount() {
            count++;
            document.getElementById('counter').innerText = count;
            localStorage.setItem('ayetinvakti_zikir', count);
            
            // Klik Sesi Çal
            playClickSound();

            // Titreşim (Android ve destekleyen cihazlarda 40ms)
            if ("vibrate" in navigator) {
                navigator.vibrate(40);
            }
        }

        function resetCount() {
            if (confirm("Sayacı sıfırlamak istediğinize emin misiniz?")) {
                count = 0;
                document.getElementById('counter').innerText = count;
                localStorage.setItem('ayetinvakti_zikir', count);
                
                // Sıfırlamada da küçük bir titreşim geri bildirimi
                if ("vibrate" in navigator) {
                    navigator.vibrate([30, 50, 30]);
                }
            }
        }
    </script>
</body>
</html>
