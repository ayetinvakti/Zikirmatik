<html lang="tr">
<head>

    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">

    <script>
        // Tema, özel renk paleti ve dil (sayfa çizilmeden önce çalışır)
        (function () {
            const d = document.documentElement;
            const savedTheme = localStorage.getItem('theme');
            const systemPrefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            const isLight = savedTheme === 'light' || (!savedTheme && !systemPrefersDark);
            if (isLight) d.classList.add('light-mode');
            const a = localStorage.getItem('custom_accent');
            const t = localStorage.getItem('custom_text');
            const b = localStorage.getItem('custom_bg');
            if (a) d.style.setProperty('--accent-color', a);
            if (t) d.style.setProperty('--text-color', t);
            if (b) {
                d.style.setProperty('--bg-color', b);
                d.style.setProperty('--card-bg', b);
            }
            // Özel arka plan var, yazı rengi seçilmemişse okunabilir renkleri zeminin açıklığına göre seç
            if (b && !t) {
                const m = /^#([0-9a-f]{6})$/i.exec(b.trim());
                if (m) {
                    const n = parseInt(m[1], 16);
                    const lin = c => { c /= 255; return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); };
                    const L = 0.2126 * lin(n >> 16) + 0.7152 * lin((n >> 8) & 255) + 0.0722 * lin(n & 255);
                    const bgIsLight = L > 0.18;
                    d.style.setProperty('--text-color', bgIsLight ? '#0f172a' : '#f8fafc');
                    d.style.setProperty('--text-muted', bgIsLight ? '#475569' : '#cbd5e1');
                    d.style.setProperty('--border-color', bgIsLight ? 'rgba(15,23,42,0.18)' : 'rgba(248,250,252,0.22)');
                }
            }
            // Safari üst/alt çubuğu sayfa zemin rengine uysun
            const meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', b || (isLight ? '#f8fafc' : '#0f172a'));

            // Dil ve yön
            const lang = localStorage.getItem('user_lang') || 'tr';
            d.setAttribute('lang', lang);
            d.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
        })();
    </script>
    <title data-i18n="page_title">Zikirmatik | Ayetin Vakti</title>
    
    <meta property="og:title" content="Zikirmatik | Ayetin Vakti">
    <meta property="og:description" content="Titreşim ve ses destekli, kullanımı kolay dijital tesbih.">
    <meta property="og:type" content="website">

    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #10b981;
            --accent-hover: #047857;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --btn-bg: rgba(255, 255, 255, 0.05);
            --btn-hover: rgba(255, 255, 255, 0.1);
            --shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            --bead-inactive: #475569;
            color-scheme: dark;
        }

        html.light-mode {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --accent-color: #059669;
            --accent-hover: #047857;
            --text-color: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --btn-bg: #f1f5f9;
            --btn-hover: #e2e8f0;
            --shadow: 0 10px 25px rgba(0, 0, 0, 0.06);
            --bead-inactive: #cbd5e1;
            color-scheme: light;
        }

        /* Tuşlara ard arda basınca sayfa yakınlaşmasın */
        html, body, button, a, select, input, label, [onclick] { touch-action: manipulation; }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            user-select: none;
            -webkit-user-select: none;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }

        .container { width: 100%; max-width: 400px; display: flex; flex-direction: column; align-items: center; }

        .navbar { width: 100%; display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; position: relative; }
        [dir="rtl"] .navbar { flex-direction: row-reverse; }

        .home-btn, .theme-icon-btn {
            background-color: var(--btn-bg); border: 1px solid var(--border-color); color: var(--text-color);
            width: 38px; height: 38px; border-radius: 50%; font-size: 1.1rem; font-weight: 600; cursor: pointer;
            display: flex; align-items: center; justify-content: center; text-decoration: none;
        }
        @media (hover: hover) {
            .home-btn:hover, .theme-icon-btn:hover { background-color: var(--btn-hover); }
        }

        /* Zikir seçici (dokununca etkin olur, hedef dolunca sıradakine geçer) */
        .sweet-dhikr-bar {
            width: 100%; display: flex; justify-content: space-around; align-items: center; gap: 6px; margin-bottom: 10px;
            padding: 6px 8px; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px; box-shadow: var(--shadow);
        }
        [dir="rtl"] .sweet-dhikr-bar { flex-direction: row-reverse; }
        .sweet-dhikr-item {
            font-family: 'Caveat', cursive, sans-serif; font-size: clamp(0.74rem, 3.4vw, 1.2rem); font-weight: 600; color: var(--text-muted);
            letter-spacing: 0.3px; padding: 4px 2px; border-radius: 12px; cursor: pointer; background: transparent; border: 1px solid transparent;
            flex: 1 1 0; min-width: 0; text-align: center; white-space: nowrap; overflow: hidden; line-height: 1.15;
        }
        .sweet-dhikr-item.active { color: var(--accent-color); border-color: var(--accent-color); background: var(--btn-bg); }

        .header { width: 100%; display: flex; flex-direction: column; align-items: center; margin-bottom: 12px; }
        .header h1 { font-size: 1.8rem; color: var(--accent-color); margin-bottom: 2px; text-align: center; }
        .header p { color: var(--text-muted); font-size: 0.85rem; text-align: center; }

        .tesbih-wrapper { position: relative; width: 300px; height: 300px; display: flex; align-items: center; justify-content: center; margin-bottom: 20px; }
        .tesbih-svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; transform: rotate(-90deg); }
        .bead { transition: fill 0.15s ease; }

        .click-area {
            width: 170px; height: 170px; border-radius: 50%; background: linear-gradient(145deg, var(--card-bg), var(--bg-color));
            border: 4px solid var(--accent-color); box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2); color: var(--text-color); font-family: inherit;
            display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer;
            transition: transform 0.06s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.06s cubic-bezier(0.4, 0, 0.2, 1), filter 0.06s ease;
            touch-action: manipulation; z-index: 2; outline: none;
        }
        .click-area:focus-visible { box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent-color) 35%, transparent); }
        .click-area:active, .click-area.pressed { transform: scale(0.91); box-shadow: 0 4px 10px color-mix(in srgb, var(--accent-color) 20%, transparent); filter: brightness(0.95); }
        .click-area.done { border-color: #f59e0b; }

        .counter-value { font-size: 2.8rem; font-weight: 800; color: var(--text-color); font-family: 'Courier New', Courier, monospace; line-height: 1; margin-bottom: 2px; font-variant-numeric: tabular-nums; }
        .counter-target-label { font-size: 0.9rem; font-weight: 600; color: var(--accent-color); margin-bottom: 2px; }
        .sub-counter { font-size: 0.75rem; color: var(--text-muted); text-align: center; line-height: 1.35; }

        .controls { display: flex; gap: 12px; width: 100%; }
        .btn {
            flex: 1; padding: 14px; border-radius: 12px; border: 1px solid var(--border-color); background-color: var(--card-bg); color: var(--text-color);
            font-weight: 600; font-size: 0.95rem; cursor: pointer; touch-action: manipulation; display: flex; align-items: center; justify-content: center; gap: 6px; box-shadow: var(--shadow);
        }
        @media (hover: hover) {
            .btn:hover { background-color: var(--btn-hover); }
        }

        .tools { display: flex; gap: 10px; width: 100%; margin-top: 10px; }
        .tool-btn {
            flex: 1; padding: 10px 6px; border-radius: 12px; border: 1px solid var(--border-color); background: var(--btn-bg); color: var(--text-color);
            font-size: 0.85rem; font-weight: 600; cursor: pointer; touch-action: manipulation;
        }
        .tool-btn.off { opacity: .5; text-decoration: line-through; }
        @media (hover: hover) {
            .tool-btn:hover { background-color: var(--btn-hover); }
        }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.6); display: none; align-items: center; justify-content: center; padding: 20px; z-index: 100; }
        .modal-card { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 20px; padding: 24px; width: 100%; max-width: 320px; display: flex; flex-direction: column; gap: 16px; box-shadow: var(--shadow); }
        .modal-title { font-size: 1.1rem; font-weight: 700; text-align: center; color: var(--text-color); }
        .target-options { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .target-opt-btn { background-color: var(--bg-color); border: 1px solid var(--border-color); color: var(--text-color); padding: 12px; border-radius: 12px; font-weight: 600; cursor: pointer; font-size: 1rem; }
        .target-opt-btn.active { background-color: var(--accent-color); border-color: var(--accent-color); color: #fff; }
        .custom-target-box { display: flex; flex-direction: column; gap: 6px; }
        .custom-target-box label { font-size: 0.85rem; color: var(--text-muted); }
        .custom-input { width: 100%; padding: 10px; border-radius: 10px; background-color: var(--bg-color); border: 1px solid var(--border-color); color: var(--text-color); font-size: 1rem; outline: none; text-align: center; user-select: text; -webkit-user-select: text; }
        .modal-close-btn { background-color: var(--accent-color); color: #fff; border: none; padding: 12px; border-radius: 12px; font-weight: 600; cursor: pointer; margin-top: 4px; }

        /* Görünüm modu seçici */
        .mode-bar { width: 100%; display: flex; gap: 6px; margin-bottom: 10px; padding: 4px; background: var(--btn-bg); border: 1px solid var(--border-color); border-radius: 14px; }
        [dir="rtl"] .mode-bar { flex-direction: row-reverse; }
        .mode-item { flex: 1 1 0; min-width: 0; padding: 8px 4px; border-radius: 10px; border: 1px solid transparent; background: transparent; color: var(--text-muted); font: inherit; font-size: 0.82rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 5px; white-space: nowrap; overflow: hidden; }
        .mode-item.active { color: var(--accent-color); border-color: var(--accent-color); background: var(--card-bg); }

        .tesbih-wrapper { touch-action: manipulation; }
        .bead-canvas, .finger-layer { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }

        /* 2. mod: parmak */
        .finger-layer { z-index: 3; overflow: visible; }
        .tesbih-wrapper.mode-finger .finger-layer { display: block; }
        .finger {
            position: absolute; left: 114px; top: 182px; width: 76px; height: 124px; transform-origin: 38px 2px;
            transform: rotate(-28deg) scale(0.92) translateY(12px); filter: drop-shadow(8px 12px 8px rgba(0, 0, 0, 0.30));
            -webkit-mask-image: linear-gradient(to bottom, #000 0, #000 55%, transparent 100%); mask-image: linear-gradient(to bottom, #000 0, #000 55%, transparent 100%);
        }
        .finger-float { width: 100%; height: 100%; animation: fingerFloat 2.4s ease-in-out infinite; }
        .finger svg { display: block; width: 100%; height: 100%; }
        @keyframes fingerFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
        .tap-ripple { position: absolute; left: 142px; top: 192px; width: 14px; height: 14px; margin: -7px 0 0 -7px; border: 2px solid var(--accent-color); border-radius: 50%; pointer-events: none; }
        @media (prefers-reduced-motion: reduce) { .finger-float { animation: none; } }


        /* 2. mod: gerçekçi parmak sayacı (tally counter) */
        .device-layer { display: none; position: absolute; left: 30px; top: 0; width: 240px; height: 300px; pointer-events: none; z-index: 1; }
        .device-layer svg { display: block; width: 100%; height: 100%; direction: ltr; overflow: visible; filter: drop-shadow(0 12px 10px rgba(0, 0, 0, 0.35)); }
        .tesbih-wrapper.mode-finger { height: 350px; }
        .tesbih-wrapper.mode-finger .tesbih-svg { display: none; }
        .tesbih-wrapper.mode-finger .device-layer { display: block; }
        .tesbih-wrapper.mode-finger .click-area { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; border-radius: 12px; background: transparent; box-shadow: none; filter: none; transform: none; justify-content: flex-end; padding-bottom: 2px; }
        .tesbih-wrapper.mode-finger .click-area:active, .tesbih-wrapper.mode-finger .click-area.pressed { transform: none; box-shadow: none; filter: none; }
        .tesbih-wrapper.mode-finger .counter-value { display: none; }
        .device-picker { display: none; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; width: 100%; margin: -4px 0 12px; }
        .device-picker .bead-sw { width: 28px; height: 28px; }

        /* 3. mod: gerçekçi tesbih */
        .tesbih-wrapper.mode-bead { width: min(330px, 100%); height: auto; aspect-ratio: 1 / 1; }
        .tesbih-wrapper.mode-bead .tesbih-svg { display: none; }
        .tesbih-wrapper.mode-bead .bead-canvas { display: block; }
        .tesbih-wrapper.mode-bead .click-area { width: 52%; height: 52%; border-width: 2px; background: color-mix(in srgb, var(--card-bg) 80%, transparent); box-shadow: none; }
        .bead-picker { display: none; gap: 12px; justify-content: center; align-items: center; width: 100%; margin: -4px 0 12px; }
        .bead-sw { width: 30px; height: 30px; padding: 0; border-radius: 50%; border: 0; cursor: pointer; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35), inset 0 -3px 5px rgba(0, 0, 0, 0.35); }
        .bead-sw.active { box-shadow: 0 0 0 2px var(--bg-color), 0 0 0 4px var(--accent-color); }
    </style>
</head>

<script>
    const translations = {

    const activeLang = translations[localStorage.getItem('user_lang')] ? localStorage.getItem('user_lang') : 'tr';
    const t = translations[activeLang];

    // <PURE>
    // Hedefe ulaşınca 0'a dönmek yerine hedef değeri (33/33) görünür; sonraki dokunuş 1'den başlar
    function loopValue(count, target) { return count <= 0 ? 0 : ((count - 1) % target) + 1; }
    function roundsDone(count, target) { return Math.floor(count / target); }
    function beadCount(target) { return target <= 60 ? Math.max(target, 12) : 60; }
    function litBeads(count, target) {
        const v = loopValue(count, target), n = beadCount(target);
        if (v <= 0) return 0;
        return v >= target ? n : Math.max(1, Math.round(v / target * n));
    }
    // </PURE>

    const store = {
        int: (k, d) => { const n = parseInt(localStorage.getItem(k), 10); return isNaN(n) ? d : n; },
        set: (k, v) => { try { localStorage.setItem(k, String(v)); } catch (e) { /* kota */ } }
    };
    let count = Math.max(0, store.int('zikir_count', 0));
    let target = Math.max(1, Math.min(100000, store.int('zikir_target', 33)));
    let activeDhikr = store.int('zikir_active', -1);          // -1: seçili değil
    let soundOn = localStorage.getItem('zikir_sound') !== '0';
    let vibOn = localStorage.getItem('zikir_vib') !== '0';
    let audioCtx = null, wakeLock = null;

    const targetModal = document.getElementById('targetModal');
    const customInput = document.getElementById('customTargetInput');
    const counterEl = document.getElementById('counter');
    const targetLabelEl = document.getElementById('targetLabel');
    const remainderLabelEl = document.getElementById('remainderLabel');
    const clickAreaEl = document.getElementById('clickArea');
    const tesbihSvg = document.getElementById('tesbihSvg');

    // ===================== TEMA =====================
    function updateThemeButton() {
        document.getElementById('theme-btn').textContent = document.documentElement.classList.contains('light-mode') ? '☀️' : '🌙';
    }
    // Safari üst/alt çubuğu sayfa zemin rengine uysun
    function updateThemeColor() {
        const meta = document.querySelector('meta[name="theme-color"]');
        if (!meta) return;
        const bg = getComputedStyle(document.documentElement).getPropertyValue('--bg-color').trim();
        if (bg) meta.setAttribute('content', bg);
    }
    function toggleTheme() {
        const isLight = document.documentElement.classList.toggle('light-mode');
        localStorage.setItem('theme', isLight ? 'light' : 'dark');
        updateThemeButton();
        updateThemeColor();
    }

    // ===================== SES / TİTREŞİM / EKRAN =====================
    function playClickSound(freq, duration) {
        if (!soundOn) return;
        try {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
            osc.type = 'triangle'; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + duration);
        } catch (e) { console.log('Ses yürütülemedi:', e); }
    }
    // DÜZELTME: Sayfa "titreşim destekli" diyordu ama hiç titreşim yoktu
    function haptic(pattern) {
        if (vibOn && navigator.vibrate) { try { navigator.vibrate(pattern); } catch (e) { /* desteklenmiyor */ } }
    }
    async function keepAwake() {
        try { if ('wakeLock' in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } } catch (e) { /* desteklenmiyor */ }
    }
    function updateToolButtons() {
        const s = document.getElementById('btnSound'), v = document.getElementById('btnVib');
        s.textContent = soundOn ? t.sound_on : t.sound_off; s.classList.toggle('off', !soundOn);
        v.textContent = vibOn ? t.vib_on : t.vib_off; v.classList.toggle('off', !vibOn);
    }
    function toggleSound() { soundOn = !soundOn; localStorage.setItem('zikir_sound', soundOn ? '1' : '0'); updateToolButtons(); }
    function toggleVib() { vibOn = !vibOn; localStorage.setItem('zikir_vib', vibOn ? '1' : '0'); updateToolButtons(); if (vibOn) haptic(30); }


    // ===================== GÖRÜNÜM MODLARI =====================
    const TAU = Math.PI * 2;
    const MODES = ['classic', 'finger', 'bead'];
    const stage = document.getElementById('stage');
    const beadCanvas = document.getElementById('beadCanvas');
    const fingerEl = document.getElementById('finger');
    const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    let mode = MODES.includes(localStorage.getItem('zikir_mode')) ? localStorage.getItem('zikir_mode') : 'classic';

    // --- Gerçekçi tesbih: 33 tane + imame (2 yuvalık), her dokunuşta zincir bir yuva döner ---
    const BV = 330, BC = 165, BR = 104, SLOTS = 35, STEP = TAU / SLOTS, PITCH = BR * STEP, BRAD = PITCH * 0.47;
    const MATERIALS = {
        amber:    { hi: '#fff0b8', mid: '#f4a828', base: '#c9740e', dark: '#5e2f04', glow: '255,205,90', glowA: 0.5, spec: 1, rim: 0.14, edge: 0.42, grain: 0, thread: '#3b2a1a', tassel: ['#b3261e', '#e2b34a'] },
        ebony:    { hi: '#8b8e97', mid: '#2c2d33', base: '#15161a', dark: '#020203', glow: '130,140,170', glowA: 0.1, spec: 1.15, rim: 0.2, edge: 0.3, grain: 0, thread: '#8a6d3b', tassel: ['#a1211b', '#d4a93c'] },
        rosewood: { hi: '#d09574', mid: '#8b4a32', base: '#5e2a1a', dark: '#240c06', glow: '210,120,80', glowA: 0.16, spec: 0.7, rim: 0.1, edge: 0.45, grain: 1, thread: '#2c1d12', tassel: ['#1f5c3a', '#d9b25a'] },
        pearl:    { hi: '#ffffff', mid: '#f3eee6', base: '#d9d1c6', dark: '#857d71', glow: '255,215,235', glowA: 0.35, spec: 0.9, rim: 0.2, edge: 0.3, grain: 0, thread: '#a89f93', tassel: ['#e8e0d0', '#c8a45a'] },
        emerald:  { hi: '#c2f7da', mid: '#20ad74', base: '#0a6b47', dark: '#022a1b', glow: '120,255,190', glowA: 0.42, spec: 1, rim: 0.14, edge: 0.42, grain: 0, thread: '#1c2a22', tassel: ['#0b6b46', '#e0be62'] }
    };
    const GOLD = { hi: '#fff3bf', mid: '#e4b84a', base: '#b8872a', dark: '#5a3d0c', glow: '255,230,150', glowA: 0.2, spec: 1, rim: 0.12, edge: 0.4, grain: 0 };
    let beadMat = MATERIALS[localStorage.getItem('zikir_bead')] ? localStorage.getItem('zikir_bead') : 'amber';
    let rot = 0, rotV = 0, rotT = 0, sway = 0, swayV = 0, animId = 0, lastT = 0, bK = 1;
    rot = rotT = (count * STEP) % TAU;
    const rnd = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

    function resizeBeadCanvas() {
        const w = stage.clientWidth; if (!w) return;
        const dpr = Math.min(window.devicePixelRatio || 1, 3);
        beadCanvas.width = beadCanvas.height = Math.round(w * dpr);
        bK = w * dpr / BV;
    }

    // Işık sol-üstten; küre (ya da imame elipsi) katman katman boyanır
    function drawBody(c, x, y, rx, ry, ang, mat, seed) {
        const ca = Math.cos(ang), sa = Math.sin(ang), sc = Math.min(1.1, ry / BRAD);
        c.save(); c.translate(x, y); c.rotate(ang);
        c.shadowColor = 'rgba(0,0,0,0.42)'; c.shadowBlur = 7 * bK * sc; c.shadowOffsetX = 3 * bK * sc; c.shadowOffsetY = 4.5 * bK * sc;
        c.fillStyle = mat.base; c.beginPath(); c.ellipse(0, 0, rx, ry, 0, 0, TAU); c.fill(); c.restore();

        c.save(); c.translate(x, y); c.rotate(ang); c.scale(rx, ry);
        c.beginPath(); c.arc(0, 0, 1, 0, TAU); c.clip();
        const vx = -0.36 * ry, vy = -0.40 * ry, lx = (ca * vx + sa * vy) / rx, ly = (-sa * vx + ca * vy) / ry;
        let g = c.createRadialGradient(lx, ly, 0.03, 0, 0, 1.05);
        g.addColorStop(0, mat.hi); g.addColorStop(0.22, mat.mid); g.addColorStop(0.65, mat.base); g.addColorStop(1, mat.dark);
        c.fillStyle = g; c.fillRect(-1.2, -1.2, 2.4, 2.4);
        g = c.createRadialGradient(-lx * 0.9, -ly * 0.9, 0, -lx * 0.9, -ly * 0.9, 0.75);   // içten geçen ışık
        g.addColorStop(0, `rgba(${mat.glow},${mat.glowA})`); g.addColorStop(1, `rgba(${mat.glow},0)`);
        c.fillStyle = g; c.fillRect(-1.2, -1.2, 2.4, 2.4);
        if (mat.grain) {                                                                      // ağaç damarı
            c.save(); c.rotate(seed * 1.7); c.lineCap = 'round';
            for (let i = 0; i < 7; i++) {
                const yy = -0.9 + i * 0.3 + (rnd(seed * 7 + i) - 0.5) * 0.18;
                c.strokeStyle = `rgba(25,8,3,${0.14 + 0.12 * rnd(seed * 3 + i)})`; c.lineWidth = 0.03 + 0.05 * rnd(seed * 5 + i);
                c.beginPath(); c.moveTo(-1.1, yy); c.bezierCurveTo(-0.4, yy - 0.2 * rnd(seed + i), 0.4, yy + 0.2 * rnd(seed * 2 + i), 1.1, yy); c.stroke();
            }
            c.restore();
        }
        g = c.createRadialGradient(lx * 0.35, ly * 0.35, 0.45, 0, 0, 1.02);                    // kenar koyulaşması
        g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, `rgba(0,0,0,${mat.edge})`);
        c.fillStyle = g; c.fillRect(-1.2, -1.2, 2.4, 2.4);
        g = c.createRadialGradient(-lx * 0.95, -ly * 0.95, 0, -lx * 0.95, -ly * 0.95, 0.55);   // alttan yansıyan ışık
        g.addColorStop(0, `rgba(255,255,255,${mat.rim})`); g.addColorStop(1, 'rgba(255,255,255,0)');
        c.fillStyle = g; c.fillRect(-1.2, -1.2, 2.4, 2.4);
        c.save(); c.translate(lx * 1.02, ly * 1.05); c.rotate(-0.6 - ang); c.scale(0.34, 0.2);   // parlama
        g = c.createRadialGradient(0, 0, 0, 0, 0, 1);
        g.addColorStop(0, `rgba(255,255,255,${0.95 * mat.spec})`); g.addColorStop(0.5, `rgba(255,255,255,${0.35 * mat.spec})`); g.addColorStop(1, 'rgba(255,255,255,0)');
        c.fillStyle = g; c.beginPath(); c.arc(0, 0, 1, 0, TAU); c.fill(); c.restore();
        c.lineWidth = 0.035; c.strokeStyle = 'rgba(0,0,0,0.28)'; c.beginPath(); c.arc(0, 0, 1, 0, TAU); c.stroke();
        c.restore();
    }

    function drawTassel(c, mat) {
        const th = Math.PI / 2 + rot, ta = th + sway;
        const ax = BC + Math.cos(th) * (BR + 9), ay = BC + Math.sin(th) * (BR + 9);
        const dx = Math.cos(ta), dy = Math.sin(ta), px = -dy, py = dx;
        const bx = ax + dx * 15, by = ay + dy * 15, n = 30;
        for (let pass = 0; pass < 2; pass++) {
            c.save(); c.lineCap = 'round';
            if (pass === 0) c.translate(2, 3);
            for (let i = 0; i < n; i++) {
                const f = i / (n - 1) - 0.5, len = 30 + 9 * rnd(i + 3), a = ta + f * 0.42 + (rnd(i) - 0.5) * 0.05;
                c.strokeStyle = pass === 0 ? 'rgba(0,0,0,0.26)' : (i % 3 === 0 ? mat.tassel[1] : mat.tassel[0]);
                c.lineWidth = pass === 0 ? 1.7 : 1.2; c.globalAlpha = pass === 0 ? 1 : 0.94;
                c.beginPath(); c.moveTo(bx, by);
                c.quadraticCurveTo(bx + dx * len * 0.45 + px * f * len * 0.1, by + dy * len * 0.45 + py * f * len * 0.1, bx + Math.cos(a) * len, by + Math.sin(a) * len);
                c.stroke();
            }
            c.restore();
        }
        c.save(); c.strokeStyle = mat.tassel[1]; c.lineWidth = 2.2; c.lineCap = 'round';
        c.beginPath(); c.moveTo(ax - dx * 3, ay - dy * 3); c.lineTo(ax + dx * 7, ay + dy * 7); c.stroke(); c.restore();
        drawBody(c, ax + dx * 8, ay + dy * 8, 3.6, 3.6, 0, GOLD, 99);
        c.save(); c.translate(ax + dx * 13.5, ay + dy * 13.5); c.rotate(ta + Math.PI / 2);   // sarma bağ
        c.fillStyle = mat.tassel[1]; c.strokeStyle = 'rgba(0,0,0,0.4)'; c.lineWidth = 0.8;
        c.fillRect(-4.5, -2.5, 9, 5); c.strokeRect(-4.5, -2.5, 9, 5);
        c.beginPath(); c.moveTo(-1.5, -2.5); c.lineTo(-1.5, 2.5); c.moveTo(1.5, -2.5); c.lineTo(1.5, 2.5); c.stroke(); c.restore();
    }

    function drawBeadScene() {
        if (!stage.clientWidth || !beadCanvas.width) return;
        const c = beadCanvas.getContext('2d'), mat = MATERIALS[beadMat];
        c.setTransform(bK, 0, 0, bK, 0, 0); c.clearRect(0, 0, BV, BV);
        c.save(); c.lineWidth = 2.2; c.strokeStyle = mat.thread;
        c.shadowColor = 'rgba(0,0,0,0.35)'; c.shadowBlur = 3 * bK; c.shadowOffsetX = 1.5 * bK; c.shadowOffsetY = 2.5 * bK;
        c.beginPath(); c.arc(BC, BC, BR, 0, TAU); c.stroke(); c.restore();
        drawTassel(c, mat);
        const at = s => Math.PI / 2 + rot + (s - 0.5) * STEP;
        for (let s = 2; s < SLOTS; s++) { const a = at(s); drawBody(c, BC + BR * Math.cos(a), BC + BR * Math.sin(a), BRAD, BRAD, 0, mat, s); }
        const ai = at(0.5);
        drawBody(c, BC + BR * Math.cos(ai), BC + BR * Math.sin(ai), PITCH * 0.99, BRAD * 1.16, ai + Math.PI / 2, mat, 1);
    }

    function stepAnim(ts) {
        animId = 0;
        if (!lastT) lastT = ts;
        const dt = Math.min(0.05, (ts - lastT) / 1000), h = 1 / 240; lastT = ts;
        for (let i = Math.max(1, Math.round(dt / h)); i > 0; i--) {
            const a = 140 * (rotT - rot) - 17 * rotV;                  // yay: hafif aşma ile yerine oturur
            rotV += a * h; rot += rotV * h;
            swayV += (-121 * sway - 2.4 * swayV - a) * h; sway += swayV * h;   // püskül atalet ile sallanır
        }
        sway = Math.max(-0.9, Math.min(0.9, sway));
        if (Math.abs(rotT - rot) < 5e-4 && Math.abs(rotV) < 5e-3 && Math.abs(sway) < 2e-3 && Math.abs(swayV) < 2e-2) {
            rot = rotT; sway = swayV = 0; lastT = 0; drawBeadScene(); return;
        }
        drawBeadScene(); animId = requestAnimationFrame(stepAnim);
    }
    function startAnim() { if (!animId) { lastT = 0; animId = requestAnimationFrame(stepAnim); } }
    function beadAdvance(delta) {
        rotT += delta;
        if (mode !== 'bead') { rot = rotT; return; }
        if (reduceMotion) { rot = rotT; drawBeadScene(); } else startAnim();
    }
    function beadReset() {
        rot = ((rot % TAU) + TAU) % TAU; rotT = rot > Math.PI ? TAU : 0;
        if (mode !== 'bead') { rot = rotT = 0; return; }
        if (reduceMotion) { rot = rotT; drawBeadScene(); } else startAnim();
    }

    // Yumuşak, naif tesbih sesi: gürültüsüz, yavaş atak, kısa ve tatlı bir "tın" (sine + hafif üst ses, alçak geçiren filtre)
    function knock(at, vol) {
        const f0 = 540 + Math.random() * 50;
        const lp = audioCtx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2200; lp.Q.value = 0.4;
        lp.connect(audioCtx.destination);
        [[f0, 0.16, 0.2], [f0 * 1.5, 0.05, 0.12]].forEach(([f, g, dec]) => {
            const o = audioCtx.createOscillator(), v = audioCtx.createGain();
            o.type = 'sine'; o.frequency.setValueAtTime(f, at); o.frequency.exponentialRampToValueAtTime(f * 0.97, at + dec);
            v.gain.setValueAtTime(0.0001, at); v.gain.linearRampToValueAtTime(g * vol, at + 0.008); v.gain.exponentialRampToValueAtTime(0.0001, at + dec);
            o.connect(v); v.connect(lp); o.start(at); o.stop(at + dec + 0.02);
        });
    }
    function playBeadClick(done) {
        if (!soundOn) return;
        try {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const now = audioCtx.currentTime; knock(now, 1); if (done) knock(now + 0.14, 0.75);
        } catch (e) { console.log('Ses yürütülemedi:', e); }
    }

    // --- Parmak modu: gerçekçi parmak sayacı (tally counter) ---
    let resetTimer = 0;
    function inResetZone(e) {
        if (mode !== 'finger' || (!e.clientX && !e.clientY)) return false;   // klavye tıklaması (0,0) sayılır
        const r = stage.getBoundingClientRect(), k = r.width / 300;
        return Math.hypot((e.clientX - r.left) / k - 196, (e.clientY - r.top) / k - 152) <= 20;
    }
    function holdReset() {
        if (count === 0) return;
        count = 0; store.set('zikir_count', 0); beadReset(); haptic([40, 30, 40]); updateDisplay();
    }
    const DEV_DIGITS = 6;
    const DEV_COLORS = {
        red:       { hi: '#ff7a6e', mid: '#d9291f', lo: '#7a0e0a', ink: 'rgba(255,255,255,0.9)' },
        orange:    { hi: '#ffc460', mid: '#f08a0c', lo: '#9c4d04', ink: 'rgba(40,20,0,0.85)' },
        yellow:    { hi: '#fff58a', mid: '#f1cb10', lo: '#8f7403', ink: 'rgba(40,30,0,0.85)' },
        lime:      { hi: '#d2ff86', mid: '#5fd01f', lo: '#2b7f09', ink: 'rgba(10,40,0,0.85)' },
        green:     { hi: '#56c98f', mid: '#128a52', lo: '#06402a', ink: 'rgba(255,255,255,0.9)' },
        blue:      { hi: '#6384ff', mid: '#1a35c9', lo: '#0a1865', ink: 'rgba(255,255,255,0.9)' },
        lightblue: { hi: '#e2f1ff', mid: '#92c2e8', lo: '#4a7ba5', ink: 'rgba(10,30,50,0.85)' },
        pink:      { hi: '#ffa6d8', mid: '#ec3c9c', lo: '#94135f', ink: 'rgba(255,255,255,0.92)' }
    };
    const DEV_NAMES = {
        tr: { red: 'Kırmızı', orange: 'Turuncu', yellow: 'Sarı', lime: 'Açık yeşil', green: 'Yeşil', blue: 'Mavi', lightblue: 'Açık mavi', pink: 'Pembe' },
        en: { red: 'Red', orange: 'Orange', yellow: 'Yellow', lime: 'Lime', green: 'Green', blue: 'Blue', lightblue: 'Light blue', pink: 'Pink' },
        ar: { red: 'أحمر', orange: 'برتقالي', yellow: 'أصفر', lime: 'أخضر فاتح', green: 'أخضر', blue: 'أزرق', lightblue: 'أزرق فاتح', pink: 'وردي' }
    };
    const DEV_LABELS = {
        tr: { title: 'ZİKİRMATİK', count: 'SAY', reset: 'SIFIRLA' },
        en: { title: 'TALLY COUNTER', count: 'COUNT', reset: 'RESET' },
        ar: { title: 'عداد التسبيح', count: 'عدّ', reset: 'تصفير' }
    };
    let devColor = DEV_COLORS[localStorage.getItem('zikir_device')] ? localStorage.getItem('zikir_device') : 'red';
    const poly = pts => 'M' + pts.map(q => q.join(' ')).join(' L') + ' Z';
    const SEGPATH = {
        a: poly([[2.2, 1.5], [3.7, 0], [10.3, 0], [11.8, 1.5], [10.3, 3], [3.7, 3]]),
        g: poly([[2.2, 13], [3.7, 11.5], [10.3, 11.5], [11.8, 13], [10.3, 14.5], [3.7, 14.5]]),
        d: poly([[2.2, 24.5], [3.7, 23], [10.3, 23], [11.8, 24.5], [10.3, 26], [3.7, 26]]),
        f: poly([[0, 3.7], [1.5, 2.2], [3, 3.7], [3, 10.8], [1.5, 12.3], [0, 10.8]]),
        b: poly([[11, 3.7], [12.5, 2.2], [14, 3.7], [14, 10.8], [12.5, 12.3], [11, 10.8]]),
        e: poly([[0, 15.2], [1.5, 13.7], [3, 15.2], [3, 22.3], [1.5, 23.8], [0, 22.3]]),
        c: poly([[11, 15.2], [12.5, 13.7], [14, 15.2], [14, 22.3], [12.5, 23.8], [11, 22.3]])
    };
    const DIGIT_SEGS = ['abcdef', 'bc', 'abdeg', 'abcdg', 'bcfg', 'acdfg', 'acdefg', 'abc', 'abcdefg', 'abcdfg'];
    let devLit = [];
    const SVGNS = 'http://www.w3.org/2000/svg';

    function buildDevice() {
        const dots = document.getElementById('devStrapDots'), box = document.getElementById('devDigits');
        if (!dots || !box) return;
        dots.textContent = ''; box.textContent = ''; devLit = [];
        for (let y = 16; y < 296; y += 22) [105, 135].forEach(x => {
            const c = document.createElementNS(SVGNS, 'circle');
            c.setAttribute('cx', x); c.setAttribute('cy', y); c.setAttribute('r', 2.6);
            c.setAttribute('fill', 'rgba(0,0,0,0.06)'); c.setAttribute('stroke', 'rgba(255,255,255,0.9)'); c.setAttribute('stroke-width', 0.8);
            dots.appendChild(c);
        });
        const all = 'abcdefg'.split('').map(k => SEGPATH[k]).join(' ');
        for (let i = 0; i < DEV_DIGITS; i++) {
            const g = document.createElementNS(SVGNS, 'g'); g.setAttribute('transform', `translate(${i * 18.27} 0)`);
            const ghost = document.createElementNS(SVGNS, 'path'); ghost.setAttribute('d', all); ghost.setAttribute('fill', 'rgba(20,30,20,0.07)');
            const lit = document.createElementNS(SVGNS, 'path'); lit.setAttribute('fill', '#141a13');
            g.append(ghost, lit); box.appendChild(g); devLit.push(lit);
        }
        applyDevColor(); paintDevice();
    }
    function applyDevColor() {
        const c = DEV_COLORS[devColor];
        ['hi', 'mid', 'lo'].forEach((k, i) => { const st = document.getElementById('dg' + i); if (st) st.setAttribute('stop-color', c[k]); });
        document.querySelectorAll('.dev-ink').forEach(el => el.setAttribute('fill', c.ink));
        const L = DEV_LABELS[activeLang] || DEV_LABELS.tr;
        [['devTxtTitle', L.title], ['devTxtCount', L.count], ['devTxtReset', L.reset]].forEach(([id, txt]) => {
            const el = document.getElementById(id); if (!el) return;
            el.textContent = txt; el.setAttribute('letter-spacing', activeLang === 'ar' ? '0' : (id === 'devTxtTitle' ? '0.9' : '0.6'));
        });
    }
    function paintDevice() {
        if (!devLit.length) return;
        const str = String(loopValue(count, target)).slice(-DEV_DIGITS), off = DEV_DIGITS - str.length;
        devLit.forEach((p, i) => {
            const ch = i >= off ? str[i - off] : null;
            p.setAttribute('d', ch === null ? '' : DIGIT_SEGS[+ch].split('').map(k => SEGPATH[k]).join(' '));
        });
    }
    function buildDevicePicker() {
        const box = document.getElementById('devicePicker'); box.textContent = '';
        const names = DEV_NAMES[activeLang] || DEV_NAMES.tr;
        Object.keys(DEV_COLORS).forEach(k => {
            const m = DEV_COLORS[k], b = document.createElement('button');
            b.type = 'button'; b.className = 'bead-sw' + (k === devColor ? ' active' : ''); b.dataset.col = k;
            b.title = names[k] || k; b.setAttribute('aria-label', b.title);
            b.style.background = `radial-gradient(circle at 32% 30%, ${m.hi}, ${m.mid} 45%, ${m.lo})`;
            b.addEventListener('click', () => {
                devColor = k; store.set('zikir_device', k);
                box.querySelectorAll('.bead-sw').forEach(x => x.classList.toggle('active', x.dataset.col === k));
                applyDevColor();
            });
            box.appendChild(b);
        });
    }
    // Plastik "tık": kısa, keskin; hedef dolunca çift tık
    function playTallyClick(done) {
        if (!soundOn) return;
        try {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const tick = (at, f, g) => {
                const o = audioCtx.createOscillator(), v = audioCtx.createGain();
                o.type = 'square'; o.frequency.setValueAtTime(f, at); o.frequency.exponentialRampToValueAtTime(f * 0.55, at + 0.03);
                v.gain.setValueAtTime(g, at); v.gain.exponentialRampToValueAtTime(0.0001, at + 0.035);
                o.connect(v); v.connect(audioCtx.destination); o.start(at); o.stop(at + 0.04);
            };
            const now = audioCtx.currentTime;
            tick(now, 2600, 0.07); tick(now + 0.012, 1100, 0.05);
            if (done) { tick(now + 0.14, 2600, 0.07); tick(now + 0.152, 1100, 0.05); }
        } catch (e) { console.log('Ses yürütülemedi:', e); }
    }
    function fingerTap() {
        // Metal COUNT tuşu çöker
        const btn = document.getElementById('devBtn'), shade = document.getElementById('devBtnShade');
        const bt = sc => `translate(112px, 192px) scale(${sc}) translate(-112px, -192px)`;
        if (btn && btn.animate) btn.animate([{ transform: bt(1) }, { transform: bt(0.9), offset: 0.4 }, { transform: bt(1) }], { duration: 170, easing: 'ease-out' });
        if (shade && shade.animate) shade.animate([{ opacity: 0 }, { opacity: 0.3, offset: 0.4 }, { opacity: 0 }], { duration: 170, easing: 'ease-out' });
        if (!fingerEl || !fingerEl.animate) return;
        const idle = 'rotate(-28deg) scale(0.92) translateY(12px)', press = 'rotate(-28deg) scale(0.82) translateY(-6px)';
        const shIdle = 'drop-shadow(8px 12px 8px rgba(0,0,0,0.30))', shPress = 'drop-shadow(2px 3px 3px rgba(0,0,0,0.45))';
        fingerEl.animate([{ transform: idle, filter: shIdle }, { transform: press, filter: shPress, offset: 0.4 }, { transform: idle, filter: shIdle }], { duration: 170, easing: 'ease-out' });
        if (reduceMotion) return;
        const r = document.createElement('div'); r.className = 'tap-ripple'; document.getElementById('fingerLayer').appendChild(r);
        const an = r.animate([{ transform: 'scale(1)', opacity: 0.7 }, { transform: 'scale(5)', opacity: 0 }], { duration: 450, easing: 'ease-out' });
        an.onfinish = () => r.remove();
    }

    // --- Mod ve malzeme seçimi ---
    function setMode(m) {
        mode = MODES.includes(m) ? m : 'classic'; store.set('zikir_mode', mode);
        stage.classList.toggle('mode-finger', mode === 'finger'); stage.classList.toggle('mode-bead', mode === 'bead');
        document.getElementById('beadPicker').style.display = mode === 'bead' ? 'flex' : 'none';
        document.getElementById('devicePicker').style.display = mode === 'finger' ? 'flex' : 'none';
        document.querySelectorAll('.mode-item').forEach(el => el.classList.toggle('active', el.dataset.mode === mode));
        if (mode === 'bead') { resizeBeadCanvas(); rot = rotT; sway = swayV = 0; drawBeadScene(); }
    }
    function buildBeadPicker() {
        const box = document.getElementById('beadPicker'); box.textContent = '';
        Object.keys(MATERIALS).forEach(k => {
            const m = MATERIALS[k], b = document.createElement('button');
            b.type = 'button'; b.className = 'bead-sw' + (k === beadMat ? ' active' : ''); b.dataset.mat = k;
            b.title = t['mat_' + k] || k; b.setAttribute('aria-label', b.title);
            b.style.background = `radial-gradient(circle at 32% 30%, ${m.hi}, ${m.mid} 38%, ${m.base} 70%, ${m.dark})`;
            b.addEventListener('click', () => {
                beadMat = k; store.set('zikir_bead', k);
                box.querySelectorAll('.bead-sw').forEach(x => x.classList.toggle('active', x.dataset.mat === k));
                drawBeadScene();
            });
            box.appendChild(b);
        });
    }

    // ===================== TESBİH HALKASI =====================
    let beadEls = [];
    function buildBeads() {
        tesbihSvg.innerHTML = ''; beadEls = [];
        const n = beadCount(target), cx = 150, cy = 150, r = 125;
        for (let i = 0; i < n; i++) {
            const a = (i * 2 * Math.PI) / n;
            const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
            c.setAttribute('cx', cx + r * Math.cos(a)); c.setAttribute('cy', cy + r * Math.sin(a));
            c.setAttribute('r', '4.5'); c.setAttribute('class', 'bead'); c.setAttribute('fill', 'var(--bead-inactive)');
            tesbihSvg.appendChild(c); beadEls.push(c);
        }
    }
    function paintBeads() {
        const lit = litBeads(count, target);
        beadEls.forEach((c, i) => {
            const on = i < lit;
            c.setAttribute('fill', on ? 'var(--accent-color)' : 'var(--bead-inactive)');
            c.setAttribute('r', on ? '5.5' : '4.5');
        });
    }

    // ===================== GÖRÜNÜM =====================
    function updateDisplay() {
        const v = loopValue(count, target);
        counterEl.textContent = v;
        targetLabelEl.textContent = `/ ${target}`;
        remainderLabelEl.textContent = '';
        remainderLabelEl.append(`${t.remainder_text}${target - v}`, document.createElement('br'),
            `${t.rounds_text}${roundsDone(count, target)} • ${t.total_text}${count}`);
        clickAreaEl.classList.toggle('done', count > 0 && v === target);
        paintBeads(); paintDevice();
        document.querySelectorAll('.sweet-dhikr-item').forEach(el => el.classList.toggle('active', parseInt(el.dataset.idx, 10) === activeDhikr));
    }

    function triggerPressEffect() {
        clickAreaEl.classList.add('pressed');
        setTimeout(() => clickAreaEl.classList.remove('pressed'), 90);
    }

    // ===================== HEDEF =====================
    function openTargetModal() {
        targetModal.style.display = 'flex';
        customInput.value = [33, 66, 99, 100].includes(target) ? '' : target;
        updateActiveButtonStates();
    }
    function closeTargetModal() { targetModal.style.display = 'none'; updateDisplay(); }
    function closeTargetModalOutside(e) { if (e.target === targetModal) closeTargetModal(); }
    function applyTarget(n) { target = n; store.set('zikir_target', target); buildBeads(); updateActiveButtonStates(); updateDisplay(); }
    function setTarget(val) { customInput.value = ''; applyTarget(val); closeTargetModal(); }
    function setCustomTarget(val) {
        const n = parseInt(val, 10);
        if (n > 0 && n <= 100000) applyTarget(n);
    }
    function updateActiveButtonStates() {
        [33, 66, 99, 100].forEach(num => {
            const btn = document.getElementById(`btn${num}`);
            if (btn) btn.classList.toggle('active', target === num);
        });
    }

    // ===================== SAYAÇ =====================
    function increment() {
        triggerPressEffect();
        keepAwake();
        count++;
        store.set('zikir_count', count);
        const completed = loopValue(count, target) === target;
        if (completed) {
            if (mode === 'bead') playBeadClick(true); else if (mode === 'finger') playTallyClick(true); else playClickSound(880, 0.25);
            haptic([80, 50, 80]);
            // Tesbihat: üç zikirden biri seçiliyse hedef dolunca sıradakine geç
            if (activeDhikr >= 0) { activeDhikr = (activeDhikr + 1) % 3; store.set('zikir_active', activeDhikr); }
        } else {
            if (mode === 'bead') playBeadClick(false); else if (mode === 'finger') playTallyClick(false); else playClickSound(650, 0.06);
            haptic(12);
        }
        if (mode === 'finger') fingerTap();
        beadAdvance(STEP);
        updateDisplay();
    }
    function undoCount() {
        if (count <= 0) return;
        count--; store.set('zikir_count', count); haptic(10); beadAdvance(-STEP); updateDisplay();
    }
    function resetCounter() {
        if (count === 0) return;
        if (confirm(t.reset_confirm)) { count = 0; store.set('zikir_count', 0); beadReset(); updateDisplay(); }
    }
    function selectDhikr(idx) {
        activeDhikr = (activeDhikr === idx) ? -1 : idx;       // aynısına tekrar dokunmak seçimi kaldırır
        store.set('zikir_active', activeDhikr); updateDisplay();
    }

    // ===================== BAŞLATMA =====================
    window.onload = () => {
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            if (t[key] && el.tagName !== 'TITLE') el.textContent = t[key];
        });
        document.querySelectorAll('[data-i18n-title]').forEach(el => {
            const key = el.getAttribute('data-i18n-title');
            if (t[key]) { el.title = t[key]; el.setAttribute('aria-label', t[key]); }
        });
        document.title = t.page_title;
        updateThemeButton(); updateThemeColor(); updateToolButtons();

        // Klasik modda yalnızca ortadaki düğme sayar; parmak ve tesbih modunda sahnenin her yerine dokunmak sayar
        stage.addEventListener('click', e => { if (mode === 'classic' && !e.target.closest('#clickArea')) return; if (inResetZone(e)) return; increment(); });
        // Parmak modunda küçük tuşa (RESET) ~0,8 sn basılı tutunca sayaç sıfırlanır; kısa dokunuş saymaz
        const rb = document.getElementById('devResetBtn');
        const rbT = sc => `translate(166px, 152px) scale(${sc}) translate(-166px, -152px)`;
        const rbRelease = () => { clearTimeout(resetTimer); resetTimer = 0; if (rb) rb.style.transform = rbT(1); };
        stage.addEventListener('pointerdown', e => {
            if (!inResetZone(e)) return;
            if (rb) rb.style.transform = rbT(0.82);
            clearTimeout(resetTimer);
            resetTimer = setTimeout(() => { resetTimer = 0; holdReset(); if (rb) rb.style.transform = rbT(1); }, 800);
        });
        ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => stage.addEventListener(ev, rbRelease));
        document.getElementById('modeBar').addEventListener('click', e => { const b = e.target.closest('.mode-item'); if (b) setMode(b.dataset.mode); });
        window.addEventListener('resize', () => { if (mode === 'bead') { resizeBeadCanvas(); drawBeadScene(); } });
        clickAreaEl.addEventListener('mousedown', triggerPressEffect);
        document.getElementById('dhikrBar').addEventListener('click', e => {
            const b = e.target.closest('.sweet-dhikr-item'); if (b) selectDhikr(parseInt(b.dataset.idx, 10));
        });
        // Bilgisayarda klavye: Boşluk/Enter = +1, Geri tuşu/Aşağı ok = −1
        document.addEventListener('keydown', e => {
            if (targetModal.style.display === 'flex' || e.target.tagName === 'INPUT') return;
            if (e.key === ' ' || e.key === 'Enter' || e.key === 'ArrowUp') { if (e.target === clickAreaEl) return; e.preventDefault(); increment(); }
            else if (e.key === 'Backspace' || e.key === 'ArrowDown') { e.preventDefault(); undoCount(); }
        });
        document.addEventListener('visibilitychange', () => { if (!document.hidden && count > 0) keepAwake(); });

        buildBeads(); buildBeadPicker(); buildDevicePicker(); buildDevice(); updateActiveButtonStates(); updateDisplay(); setMode(mode);
    };
</script>
